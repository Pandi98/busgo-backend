# Application
spring.application.name=bus-ticket-booking

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/bus_ticket_bookings?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# JWT

app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.busticketbooking=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Email Configuration :
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pandibusgo@gmail.com
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
